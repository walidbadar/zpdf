#
# native_sim/native/64: the SDL window stands in for the display, the mouse
# for the touch screen. Documents are host files given with --pdf=<path>.

CONFIG_LV_COLOR_DEPTH_32=y

# Documents are read into the kernel heap on the host
CONFIG_HEAP_MEM_POOL_SIZE=67108864

CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_LV_USE_SNAPSHOT=y

# Room for lv_snapshot_take() of the whole screen (--shot)
CONFIG_LV_Z_MEM_POOL_SIZE=4194304
