# --- Speed ----------------------------------------------------------------
# Largest caches the ESP32-S3 offers: code runs from flash and every page
# buffer lives in PSRAM, both go through these caches. 64-byte data lines
# suit the renderer's sequential access to tiles and masks.
CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
CONFIG_ESP32S3_INSTRUCTION_CACHE_8WAYS=y
CONFIG_ESP32S3_INSTRUCTION_CACHE_LINE_32B=y
CONFIG_ESP32S3_INSTRUCTION_CACHE_WRAP=y
CONFIG_ESP32S3_DATA_CACHE_64KB=y
CONFIG_ESP32S3_DATA_CACHE_8WAYS=y
CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
CONFIG_ESP32S3_DATA_CACHE_WRAP=y
# Octal PSRAM and flash at 80 MHz, flash in quad I/O mode
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
# -O3 on top of CONFIG_SPEED_OPTIMIZATIONS (prj.conf); flash has room
CONFIG_COMPILER_OPT="-O3"

# The document and everything decoded from it live in the 8 MB octal PSRAM
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=8126464

# SD card (4-bit SDMMC) with FAT; long names so real file names show
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_FS_FATFS_EXFAT=y
# A card with an unknown file system is reported, not formatted
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Render the next frame while the previous one goes out over SPI
CONFIG_LV_Z_FLUSH_THREAD=y

# Pages are rendered in tiles of twice the viewport, so 300 % costs about
# 1.7 MB for the tile plus the renderer's masks
CONFIG_ZPDF_APP_MAX_ZOOM_PCT=300
