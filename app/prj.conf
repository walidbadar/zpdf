# --- PDF library -----------------------------------------------------------
CONFIG_ZPDF=y
CONFIG_ZPDF_LOG_LEVEL=2

# --- Kernel ----------------------------------------------------------------
# The main thread only runs LVGL and the UI; parsing and rendering run on
# the worker thread (CONFIG_ZPDF_APP_RENDER_STACK_SIZE).
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_FPU=y
CONFIG_SPEED_OPTIMIZATIONS=y

# --- Display and touch (LVGL) ---------------------------------------------
CONFIG_DISPLAY=y
CONFIG_INPUT=y
# Touch events are dispatched by the input thread, which by default has the
# lowest priority and would starve behind the render worker: run it above
# the worker, and keep room for a burst of move events.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=5
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64
CONFIG_LVGL=y
CONFIG_LV_Z_POINTER_INPUT=y
# Widgets and label text; rendered pages are our own buffers in PSRAM
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_VDB_SIZE=12
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
