<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="zpdf: PDF reader for Zephyr RTOS">
  <!-- Transparent background: the text colour follows the viewer's colour scheme -->
  <style>
    :root { --fg: #1b1d21; --fg2: #57606a; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ffffff; --fg2: #b0b5bd; } }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#1b3a8a"/>
    </linearGradient>
  </defs>
  <!-- Logo (viewBox 256x256) scaled to 200x200 -->
  <g transform="translate(170,60) scale(0.78125)">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <path d="M72 40H152L192 80V216H72Z" fill="#ffffff"/>
    <path d="M152 40V80H192Z" fill="#cfe0fb"/>
    <path d="M100 118H164L100 182H164" fill="none" stroke="#1b3a8a" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="410" y="178" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="120" font-weight="bold" style="fill:var(--fg)">zpdf</text>
  <text x="414" y="232" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="30" style="fill:var(--fg2)">PDF reader for Zephyr RTOS</text>
</svg>
